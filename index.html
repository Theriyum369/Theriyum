<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Theriyum</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    header {
      padding: 24px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .version {
      color: #777;
      font-size: 13px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 50px 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 45px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
    }

    .search-box {
      display: flex;
      max-width: 650px;
      margin: 30px auto;
    }

    .search-box input {
      flex: 1;
      padding: 16px;
      border: 1px solid #333;
      border-radius: 10px 0 0 10px;
      background: #151515;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .search-box button {
      padding: 16px 22px;
      border: none;
      border-radius: 0 10px 10px 0;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .search-box button:hover {
      background: #ddd;
    }

    .section-title {
      margin-top: 45px;
      margin-bottom: 18px;
      color: #aaa;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .song-card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .song-card h2 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    .artist {
      color: #aaa;
      margin-bottom: 18px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tag {
      background: #242424;
      border-radius: 20px;
      padding: 7px 12px;
      color: #ccc;
      font-size: 13px;
    }

    .connections {
      padding-top: 15px;
      border-top: 1px solid #292929;
      color: #aaa;
      line-height: 1.7;
    }

    .connections strong {
      color: white;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .actions a {
      text-decoration: none;
      padding: 11px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .listen {
      background: white;
      color: black;
    }

    .buy {
      border: 1px solid #555;
      color: white;
    }

    .hidden {
      display: none;
    }

    #loadingMessage,
    #errorMessage,
    #noResults {
      color: #888;
      text-align: center;
      padding: 30px;
    }

    #errorMessage,
    #noResults {
      display: none;
    }

    .library-count {
      color: #666;
      font-size: 13px;
      margin-bottom: 18px;
    }

    footer {
      text-align: center;
      color: #555;
      padding: 50px 20px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 36px;
      }

      .actions {
        flex-direction: column;
      }

      .actions a {
        text-align: center;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">THERIYUM</div>
  <div class="version">Prototype v0.1</div>
</header>

<main>

  <section class="hero">
    <h1>Find the sound.</h1>

    <p>
      Discover music through artists, songs, sounds,
      scenes, eras and the connections between them.
    </p>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="Search a song, artist, genre, sound..."
      >

      <button onclick="searchMusic()">
        Search
      </button>
    </div>
  </section>

  <div class="section-title">
    Music
  </div>

  <div id="libraryCount" class="library-count"></div>

  <div id="loadingMessage">
    Loading music from Theriyum...
  </div>

  <div id="errorMessage">
    Theriyum could not load the music library.
  </div>

  <div id="results"></div>

  <div id="noResults">
    No matches yet. Try another search.
  </div>

</main>

<footer>
  Theriyum — Follow the connections.
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
  const SUPABASE_URL =
    "https://jmgimkrmdqrziiumcepg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_DugDCtB0nTGyjPxJfy2g8Q_9yJy8O3Y";

  const theriyumDB = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  function escapeHTML(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  async function loadTheriyumSongs() {

    const loadingMessage =
      document.getElementById("loadingMessage");

    const errorMessage =
      document.getElementById("errorMessage");

    const results =
      document.getElementById("results");

    const libraryCount =
      document.getElementById("libraryCount");


    const { data, error } = await theriyumDB
      .from("songs")
      .select(`
        id,
        title,
        soundcloud_url,
        soundcloud_id,
        artists (
          name
        )
      `)
      .order("title", { ascending: true });


    if (error) {

      console.error(
        "Theriyum database error:",
        error
      );

      loadingMessage.style.display = "none";
      errorMessage.style.display = "block";

      return;
    }


    loadingMessage.style.display = "none";

    const songs = data || [];

    libraryCount.textContent =
      songs.length + " tracks in Theriyum";


    if (songs.length === 0) {

      results.innerHTML =
        "<p>No music has been added yet.</p>";

      return;
    }


    results.innerHTML = songs.map(function(song) {

      const title =
        escapeHTML(song.title || "Untitled Track");

      const artistName =
        escapeHTML(
          song.artists?.name ||
          "Unknown Artist"
        );

      const soundcloudUrl =
        song.soundcloud_url || "";

      const searchableText =
        escapeHTML(
          (
            (song.title || "") +
            " " +
            (song.artists?.name || "")
          ).toLowerCase()
        );


      let listenButton = "";

      if (soundcloudUrl) {

        listenButton = `
          <a
            class="listen"
            href="${escapeHTML(soundcloudUrl)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ▶ Listen
          </a>
        `;

      }


      return `
        <article
          class="song-card"
          data-search="${searchableText}"
        >

          <h2>${title}</h2>

          <div class="artist">
            ${artistName}
          </div>

          <div class="tags">
            ${
              song.soundcloud_id
                ? '<span class="tag">SoundCloud</span>'
                : '<span class="tag">Theriyum</span>'
            }
          </div>

          <div class="connections">
            <strong>Theriyum Connections</strong><br>
            Artist → ${artistName}<br>
            Related music → coming next
          </div>

          <div class="actions">

            ${listenButton}

            <a
              class="buy"
              href="#"
              onclick="comingSoon(event)"
            >
              Buy Track
            </a>

          </div>

        </article>
      `;

    }).join("");


    searchMusic();
  }


  function searchMusic() {

    const input =
      document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const cards =
      document.querySelectorAll(".song-card");

    let matches = 0;


    cards.forEach(function(card) {

      const searchableText =
        (
          card.innerText +
          " " +
          (card.dataset.search || "")
        ).toLowerCase();


      if (
        input === "" ||
        searchableText.includes(input)
      ) {

        card.classList.remove("hidden");
        matches++;

      } else {

        card.classList.add("hidden");

      }

    });


    document.getElementById("noResults").style.display =
      cards.length > 0 && matches === 0
        ? "block"
        : "none";
  }


  document
    .getElementById("searchInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          searchMusic();
        }

      }
    );


  function comingSoon(event) {

    event.preventDefault();

    alert(
      "Purchasing is coming to Theriyum. This button will eventually connect listeners directly to a legitimate place to buy the track."
    );
  }


  loadTheriyumSongs();
</script>

</body>
</html>
